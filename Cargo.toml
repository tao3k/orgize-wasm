[workspace]
resolver = "2"

[package]
name = "orgize-wasm"
publish = false
version = "0.10.0-alpha.7"
authors = ["PoiScript <poiscript@gmail.com>"]
repository = "https://github.com/tao3k/orgize-wasm"
edition = "2024"
license = "MIT"
description = "WebAssembly bindings for the orgize Org parser."

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "unit"
path = "tests/unit/lib.rs"

[dependencies]
orgize = { path = ".." }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
wasm-bindgen = "0.2.120"

[dev-dependencies]
asp-rust = { git = "https://github.com/tao3k/asp-rust", rev = "77fb11ea7e9b767320fb9f7706bcd63d182110da", version = "0.1.2" }
insta = "1.47.2"

[build-dependencies]
asp-rust-build-support = { git = "https://github.com/tao3k/asp-rust", rev = "77fb11ea7e9b767320fb9f7706bcd63d182110da", version = "0.1.0" }
orgize-wasm-build-support = { path = "build-support" }
